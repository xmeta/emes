name: battery-fuse-envelope

on:
  push:
    branches: ["main"]
    paths:
      - "spec/emes-power-v0.schema.json"
      - "spec/emes-battery-known-envelope-v0.schema.json"
      - "catalogs/jkbms-bd6a20s6p.catalog.json"
      - "catalogs/littelfuse-midi70v-40a.catalog.json"
      - "examples/power-pack-molicel-p45b-fused/mechanism.json"
      - "examples/power-pack-molicel-p45b-fused/known-envelope-20c.json"
      - "tools/battery_known_envelope.py"
      - ".github/workflows/battery-fuse-envelope.yml"
      - "tools/ci/battery-fuse-envelope.sh"
      - "tools/evidence.py"
      - "spec/emes-evidence-v0.schema.json"
      - "requirements-dev.txt"
      - "tools/catalog.py"
      - "tools/power.py"
      - "tools/validate.py"
      - "tools/battery_pulse.py"
      - "spec/emes-ir-v0.schema.json"
      - "spec/emes-catalog-v0.schema.json"
      - "spec/emes-battery-pulse-v0.schema.json"
      - "catalogs/molicel-p45b.catalog.json"
      - "catalogs/reference-power.catalog.json"
      - "examples/power-pack-molicel-p45b/pulse-10s-soc50.json"
  pull_request:
    paths:
      - "spec/emes-power-v0.schema.json"
      - "spec/emes-battery-known-envelope-v0.schema.json"
      - "catalogs/jkbms-bd6a20s6p.catalog.json"
      - "catalogs/littelfuse-midi70v-40a.catalog.json"
      - "examples/power-pack-molicel-p45b-fused/mechanism.json"
      - "examples/power-pack-molicel-p45b-fused/known-envelope-20c.json"
      - "tools/battery_known_envelope.py"
      - ".github/workflows/battery-fuse-envelope.yml"
      - "tools/ci/battery-fuse-envelope.sh"
      - "tools/evidence.py"
      - "spec/emes-evidence-v0.schema.json"
      - "requirements-dev.txt"
      - "tools/catalog.py"
      - "tools/power.py"
      - "tools/validate.py"
      - "tools/battery_pulse.py"
      - "spec/emes-ir-v0.schema.json"
      - "spec/emes-catalog-v0.schema.json"
      - "spec/emes-battery-pulse-v0.schema.json"
      - "catalogs/molicel-p45b.catalog.json"
      - "catalogs/reference-power.catalog.json"
      - "examples/power-pack-molicel-p45b/pulse-10s-soc50.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explicit-fuse-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: bash tools/ci/battery-fuse-envelope.sh
