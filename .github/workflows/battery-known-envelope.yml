name: battery-known-envelope

on:
  push:
    branches: ["main"]
    paths:
      - "tools/battery_known_envelope.py"
      - "tools/battery_pulse.py"
      - "examples/power-pack-molicel-p45b/**"
      - "catalogs/jkbms-bd6a20s6p.catalog.json"
      - "catalogs/synqor-nq60w60hgc40.catalog.json"
      - "catalogs/sources/synqor-nq60w60hgc40.source.json"
      - "tools/providers/synqor_nq60.py"
      - "catalogs/reference-power.catalog.json"
      - ".github/workflows/battery-known-envelope.yml"
      - "tools/ci/battery-known-envelope.sh"
      - "tools/evidence.py"
      - "spec/emes-evidence-v0.schema.json"
      - "requirements-dev.txt"
      - "tools/catalog.py"
      - "tools/power.py"
      - "tools/validate.py"
      - "spec/emes-ir-v0.schema.json"
      - "spec/emes-catalog-v0.schema.json"
      - "spec/emes-power-v0.schema.json"
      - "spec/emes-battery-pulse-v0.schema.json"
      - "catalogs/molicel-p45b.catalog.json"
  pull_request:
    paths:
      - "tools/battery_known_envelope.py"
      - "tools/battery_pulse.py"
      - "examples/power-pack-molicel-p45b/**"
      - "catalogs/jkbms-bd6a20s6p.catalog.json"
      - "catalogs/synqor-nq60w60hgc40.catalog.json"
      - "catalogs/sources/synqor-nq60w60hgc40.source.json"
      - "tools/providers/synqor_nq60.py"
      - "catalogs/reference-power.catalog.json"
      - ".github/workflows/battery-known-envelope.yml"
      - "tools/ci/battery-known-envelope.sh"
      - "tools/evidence.py"
      - "spec/emes-evidence-v0.schema.json"
      - "requirements-dev.txt"
      - "tools/catalog.py"
      - "tools/power.py"
      - "tools/validate.py"
      - "spec/emes-ir-v0.schema.json"
      - "spec/emes-catalog-v0.schema.json"
      - "spec/emes-power-v0.schema.json"
      - "spec/emes-battery-pulse-v0.schema.json"
      - "catalogs/molicel-p45b.catalog.json"

permissions:
  contents: read

jobs:
  weakest-known-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: bash tools/ci/battery-known-envelope.sh
