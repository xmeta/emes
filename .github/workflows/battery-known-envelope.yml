name: battery-known-envelope

on:
  push:
    paths:
      - "tools/battery_known_envelope.py"
      - "tools/battery_pulse.py"
      - "examples/power-pack-molicel-p45b/**"
      - "catalogs/reference-bms-thermal.catalog.json"
      - "catalogs/reference-power.catalog.json"
      - ".github/workflows/battery-known-envelope.yml"
  pull_request:
    paths:
      - "tools/battery_known_envelope.py"
      - "tools/battery_pulse.py"
      - "examples/power-pack-molicel-p45b/**"
      - "catalogs/reference-bms-thermal.catalog.json"
      - "catalogs/reference-power.catalog.json"
      - ".github/workflows/battery-known-envelope.yml"

permissions:
  contents: read

jobs:
  weakest-known-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python tools/power.py examples/power-pack-molicel-p45b/mechanism.json --out /tmp/power.json --check-determinism
      - run: python tools/battery_pulse.py examples/power-pack-molicel-p45b/mechanism.json --analysis-request examples/power-pack-molicel-p45b/pulse-10s-soc50.json --power-evidence /tmp/power.json --out /tmp/pulse.json --check-determinism
      - run: python tools/battery_known_envelope.py examples/power-pack-molicel-p45b/mechanism.json --power-evidence /tmp/power.json --pulse-evidence /tmp/pulse.json --out /tmp/known-envelope.json --check-determinism
      - run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          evidence = json.loads(Path('/tmp/known-envelope.json').read_text())
          assert evidence['limiting_candidate'] == 'converter_continuous_output_current'
          candidates = {item['id']: item for item in evidence['candidates']}
          assert math.isclose(candidates['cell_pulse_power']['scale_factor'], 6.384)
          assert math.isclose(candidates['bms_continuous_current']['scale_factor'], 2.052)
          assert math.isclose(candidates['converter_continuous_output_current']['scale_factor'], 1.44)
          metrics = {item['id']: item['value'] for item in evidence['metrics']}
          assert math.isclose(metrics['M_KNOWN_COMPONENT_LOAD_SCALE_LIMIT'], 1.44)
          assert math.isclose(metrics['M_KNOWN_COMPONENT_OUTPUT_POWER_ENVELOPE'], 720.0)
          assert math.isclose(metrics['M_KNOWN_COMPONENT_INPUT_POWER_ENVELOPE'], 757.8947368421053)
          print('VERIFIED converter is weakest currently-known component')
          PY
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.catalog import canonical_digest

          mechanism = json.loads(Path('examples/power-pack-molicel-p45b/mechanism.json').read_text())
          catalog = json.loads(Path('catalogs/reference-bms-thermal.catalog.json').read_text())
          catalog['parts'][0]['properties']['continuous_discharge_current']['value'] = 16.0
          temp_catalog = Path('/tmp/bms16.catalog.json')
          temp_catalog.write_text(json.dumps(catalog))
          for binding in mechanism['extensions']['org.emes.catalogs']:
              if binding['id'] == 'CAT_BMS_THERMAL':
                  binding['path'] = str(temp_catalog)
                  binding['digest'] = canonical_digest(catalog)
          for component in mechanism['components']:
              if component['id'] == 'bms':
                  component['metadata']['org.emes.catalog_ref']['digest'] = canonical_digest(catalog['parts'][0])
          Path('/tmp/mechanism-bms16.json').write_text(json.dumps(mechanism))
          PY
          python tools/power.py /tmp/mechanism-bms16.json --out /tmp/power-bms16.json
          python tools/battery_pulse.py /tmp/mechanism-bms16.json --analysis-request examples/power-pack-molicel-p45b/pulse-10s-soc50.json --power-evidence /tmp/power-bms16.json --out /tmp/pulse-bms16.json
          python tools/battery_known_envelope.py /tmp/mechanism-bms16.json --power-evidence /tmp/power-bms16.json --pulse-evidence /tmp/pulse-bms16.json --out /tmp/known-envelope-bms16.json
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          evidence = json.loads(Path('/tmp/known-envelope-bms16.json').read_text())
          assert evidence['limiting_candidate'] == 'bms_continuous_current'
          metrics = {item['id']: item['value'] for item in evidence['metrics']}
          assert math.isclose(metrics['M_KNOWN_COMPONENT_OUTPUT_POWER_ENVELOPE'], 547.2)
          assert math.isclose(metrics['M_KNOWN_COMPONENT_INPUT_POWER_ENVELOPE'], 576.0)
          print('VERIFIED weakest-link identity changes when BMS current limit tightens')
          PY
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('/tmp/pulse.json').read_text())
          evidence['input_power_evidence_digest'] = 'sha256:' + '0' * 64
          Path('/tmp/tampered-pulse.json').write_text(json.dumps(evidence))
          PY
          if python tools/battery_known_envelope.py examples/power-pack-molicel-p45b/mechanism.json --power-evidence /tmp/power.json --pulse-evidence /tmp/tampered-pulse.json --out /tmp/invalid.json; then
            echo 'ERROR: tampered pulse evidence unexpectedly accepted'
            exit 1
          fi
          echo 'EXPECTED-FAIL evidence lineage mismatch rejected'
