name: battery-connector-envelope

on:
  push:
    branches: ["main"]
    paths:
      - "spec/emes-power-v0.schema.json"
      - "catalogs/jkbms-bd6a20s6p.catalog.json"
      - "catalogs/synqor-nq60w60hgc40.catalog.json"
      - "catalogs/sources/synqor-nq60w60hgc40.source.json"
      - "tools/providers/synqor_nq60.py"
      - "catalogs/anderson-sb50-992g4-5900.catalog.json"
      - "catalogs/sources/anderson-sb50-992g4-5900.source.json"
      - "catalogs/littelfuse-dcnhf60ng12-f.catalog.json"
      - "catalogs/sources/littelfuse-dcnhf60ng12-f.source.json"
      - "examples/power-pack-molicel-p45b-connected/mechanism.json"
      - "tools/providers/anderson_sb50.py"
      - "tools/providers/littelfuse_dcnhf60.py"
      - "tools/battery_connector_envelope.py"
      - ".github/workflows/battery-connector-envelope.yml"
      - "tools/ci/battery-connector-envelope.sh"
      - "tools/evidence.py"
      - "spec/emes-evidence-v0.schema.json"
      - "requirements-dev.txt"
      - "tools/catalog.py"
      - "tools/power.py"
      - "tools/validate.py"
      - "tools/battery_pulse.py"
      - "tools/battery_known_envelope.py"
      - "spec/emes-ir-v0.schema.json"
      - "spec/emes-catalog-v0.schema.json"
      - "spec/emes-battery-pulse-v0.schema.json"
      - "spec/emes-battery-known-envelope-v0.schema.json"
      - "catalogs/molicel-p45b.catalog.json"
      - "catalogs/reference-power.catalog.json"
      - "catalogs/littelfuse-midi70v-40a.catalog.json"
      - "examples/power-pack-molicel-p45b/pulse-10s-soc50.json"
  pull_request:
    paths:
      - "spec/emes-power-v0.schema.json"
      - "catalogs/jkbms-bd6a20s6p.catalog.json"
      - "catalogs/synqor-nq60w60hgc40.catalog.json"
      - "catalogs/sources/synqor-nq60w60hgc40.source.json"
      - "tools/providers/synqor_nq60.py"
      - "catalogs/anderson-sb50-992g4-5900.catalog.json"
      - "catalogs/sources/anderson-sb50-992g4-5900.source.json"
      - "catalogs/littelfuse-dcnhf60ng12-f.catalog.json"
      - "catalogs/sources/littelfuse-dcnhf60ng12-f.source.json"
      - "examples/power-pack-molicel-p45b-connected/mechanism.json"
      - "tools/providers/anderson_sb50.py"
      - "tools/providers/littelfuse_dcnhf60.py"
      - "tools/battery_connector_envelope.py"
      - ".github/workflows/battery-connector-envelope.yml"
      - "tools/ci/battery-connector-envelope.sh"
      - "tools/evidence.py"
      - "spec/emes-evidence-v0.schema.json"
      - "requirements-dev.txt"
      - "tools/catalog.py"
      - "tools/power.py"
      - "tools/validate.py"
      - "tools/battery_pulse.py"
      - "tools/battery_known_envelope.py"
      - "spec/emes-ir-v0.schema.json"
      - "spec/emes-catalog-v0.schema.json"
      - "spec/emes-battery-pulse-v0.schema.json"
      - "spec/emes-battery-known-envelope-v0.schema.json"
      - "catalogs/molicel-p45b.catalog.json"
      - "catalogs/reference-power.catalog.json"
      - "catalogs/littelfuse-midi70v-40a.catalog.json"
      - "examples/power-pack-molicel-p45b/pulse-10s-soc50.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-side-connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: bash tools/ci/battery-connector-envelope.sh
