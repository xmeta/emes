name: jkbms-provider

on:
  push:
    branches: ["main"]
    paths:
      - "tools/providers/jkbms.py"
      - "catalogs/sources/jkbms-bd6a20s6p.source.json"
      - "catalogs/jkbms-bd6a20s6p.catalog.json"
      - ".github/workflows/jkbms-provider.yml"
      - "tools/ci/jkbms-provider.sh"
      - "tools/catalog.py"
      - "spec/emes-catalog-v0.schema.json"
  pull_request:
    paths:
      - "tools/providers/jkbms.py"
      - "catalogs/sources/jkbms-bd6a20s6p.source.json"
      - "catalogs/jkbms-bd6a20s6p.catalog.json"
      - ".github/workflows/jkbms-provider.yml"
      - "tools/ci/jkbms-provider.sh"
      - "tools/catalog.py"
      - "spec/emes-catalog-v0.schema.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoritative-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.26.0
      - run: bash tools/ci/jkbms-provider.sh
