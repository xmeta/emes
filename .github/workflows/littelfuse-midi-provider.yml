name: littelfuse-midi-provider

on:
  push:
    branches: ["main"]
    paths:
      - "tools/providers/littelfuse_midi.py"
      - "catalogs/sources/littelfuse-midi70v-40a.source.json"
      - "catalogs/littelfuse-midi70v-40a.catalog.json"
      - ".github/workflows/littelfuse-midi-provider.yml"
      - "tools/ci/littelfuse-midi-provider.sh"
      - "tools/catalog.py"
      - "spec/emes-catalog-v0.schema.json"
  pull_request:
    paths:
      - "tools/providers/littelfuse_midi.py"
      - "catalogs/sources/littelfuse-midi70v-40a.source.json"
      - "catalogs/littelfuse-midi70v-40a.catalog.json"
      - ".github/workflows/littelfuse-midi-provider.yml"
      - "tools/ci/littelfuse-midi-provider.sh"
      - "tools/catalog.py"
      - "spec/emes-catalog-v0.schema.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewed-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.26.0
      - run: bash tools/ci/littelfuse-midi-provider.sh
