name: littelfuse-midi-provider

on:
  push:
    branches: ["main"]
    paths:
      - "tools/providers/littelfuse_midi.py"
      - "catalogs/sources/littelfuse-midi70v-40a.source.json"
      - "catalogs/littelfuse-midi70v-40a.catalog.json"
      - ".github/workflows/littelfuse-midi-provider.yml"
      - "tools/catalog.py"
      - "spec/emes-catalog-v0.schema.json"
  pull_request:
    paths:
      - "tools/providers/littelfuse_midi.py"
      - "catalogs/sources/littelfuse-midi70v-40a.source.json"
      - "catalogs/littelfuse-midi70v-40a.catalog.json"
      - ".github/workflows/littelfuse-midi-provider.yml"
      - "tools/catalog.py"
      - "spec/emes-catalog-v0.schema.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewed-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.26.0
      - run: python tools/providers/littelfuse_midi.py normalize catalogs/sources/littelfuse-midi70v-40a.source.json /tmp/littelfuse.catalog.json
      - run: |
          python - <<'PY'
          import json
          committed = json.load(open('catalogs/littelfuse-midi70v-40a.catalog.json'))
          generated = json.load(open('/tmp/littelfuse.catalog.json'))
          assert committed == generated
          print('VALID deterministic-littelfuse-catalog-content')
          PY
      - run: python tools/catalog.py validate catalogs/littelfuse-midi70v-40a.catalog.json
      - run: |
          python - <<'PY'
          import json
          source = json.load(open('catalogs/sources/littelfuse-midi70v-40a.source.json'))
          upstream = source['upstream']['datasheet_pdf']
          assert upstream['integrity_status'] == 'raw_bytes_not_pinned'
          assert upstream['sha256'] is None
          assert upstream['bytes'] is None
          print('VALID explicit-unpinned-raw-source-state')
          PY
