name: littelfuse-midi-provider

on:
  push:
    paths:
      - "tools/providers/littelfuse_midi.py"
      - "catalogs/sources/littelfuse-midi70v-40a.source.json"
      - "catalogs/littelfuse-midi70v-40a.catalog.json"
      - ".github/workflows/littelfuse-midi-provider.yml"
  pull_request:
    paths:
      - "tools/providers/littelfuse_midi.py"
      - "catalogs/sources/littelfuse-midi70v-40a.source.json"
      - "catalogs/littelfuse-midi70v-40a.catalog.json"
      - ".github/workflows/littelfuse-midi-provider.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoritative-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/providers/littelfuse_midi.py verify-snapshot catalogs/sources/littelfuse-midi70v-40a.source.json
